apiVersion: apps/v1
kind: Deployment
metadata:
  name: cinem-app
  labels:
    app: cinem-app
  # TODO: rename this to soul-of-lahore so it matches the repo + image name
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cinem-app
  template:
    metadata:
      labels:
        app: cinem-app
    spec:
      containers:
        - name: cinem-app
          image: atikaaa/soul-of-lahore:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
